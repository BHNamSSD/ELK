input {
	beats {
		port => 5500
		ssl => true
		ssl_certificate => "/etc/logstash/certs/elk-logstash/elk-logstash.crt"
		ssl_key => "/etc/logstash/certs/elk-logstash/elk-logstash.key"
	}
}

filter {
	if [winlog][event_id] == "4625" {
		mutate {
		add_tag => ["failed_login"]
		}
    
		# Có thể tách thông tin cần thiết ra fields riêng
		mutate {
			rename => {
				"[winlog][event_data][TargetUserName]" => "user"
				"[winlog][event_data][IpAddress]" => "source_ip"
				"[winlog][event_data][WorkstationName]" => "workstation"
				"[winlog][event_data][FailureReason]" => "failure_reason"
			}
		}
	} else {
		# Nếu không phải event 4625, bạn có thể drop luôn
		drop { }
	}
}

output {
	stdout {
		codec => rubydebug
    }
}


