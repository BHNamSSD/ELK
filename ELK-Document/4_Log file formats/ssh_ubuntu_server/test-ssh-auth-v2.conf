output {
	elasticsearch {
		hosts => [""]
		#user => ""
		#password =>
		api_key => ":"
		cacert => ""
		index => "test-v2-%{+YYYY.MM.dd}"
		ilm_enabled => false
		manage_template => false
		ssl => true
	}
	stdout { codec => rubydebug }
}

